   name: Build native app

   on:
     push:
       branches: [main, master]
       paths: ["index.html", "native/**", ".github/workflows/build-native.yml"]
       tags: ["v*"]
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     build:
       strategy:
         fail-fast: false
         matrix:
           include:
             - os: macos-latest
               artifact: OITem-Pillar-Tracker-macOS-AppleSilicon
             - os: macos-15-intel
               artifact: OITem-Pillar-Tracker-macOS-Intel
             - os: windows-latest
               artifact: OITem-Pillar-Tracker-Windows
       runs-on: ${{ matrix.os }}
       defaults:
         run:
           working-directory: native
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Install dependencies
           run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt pyinstaller

         - name: Sync UI with the web version (index.html)
           shell: bash
           run: |
             if [ -f ../index.html ]; then python tools/patch_index.py ../index.html app/web/index.html; fi

         - name: Self-test (source)
           run: python app/main.py --selftest

         - name: Build
           run: pyinstaller --noconfirm build.spec

         - name: Self-test (built app) and package - macOS
           if: runner.os == 'macOS'
           run: |
             set +e
             "dist/OITem Pillar Tracker.app/Contents/MacOS/OITem Pillar Tracker" --selftest --log selftest.log; code=$?
             set -e
             cat selftest.log; test $code -eq 0
             ditto -c -k --sequesterRsrc --keepParent "dist/OITem Pillar Tracker.app" "${{ matrix.artifact }}.zip"

         - name: Self-test (built app) and package - Windows
           if: runner.os == 'Windows'
           shell: pwsh
           run: |
             $p = Start-Process -FilePath "dist/OITem Pillar Tracker/OITem Pillar Tracker.exe" -ArgumentList "--selftest","--log","selftest.log" -Wait -PassThru
             Get-Content selftest.log
             if ($p.ExitCode -ne 0) { exit 1 }
             Compress-Archive -Path "dist/OITem Pillar Tracker" -DestinationPath "${{ matrix.artifact }}.zip"

         - uses: actions/upload-artifact@v4
           with:
             name: ${{ matrix.artifact }}
             path: native/${{ matrix.artifact }}.zip

         - name: Attach to release (tag push only)
           if: startsWith(github.ref, 'refs/tags/v')
           uses: softprops/action-gh-release@v2
           with:
             files: native/${{ matrix.artifact }}.zip
